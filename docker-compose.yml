services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: playref_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: playref_postgres
    environment:
      POSTGRES_USER: playref
      POSTGRES_PASSWORD: playref
      POSTGRES_DB: playref
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:

